name: ReaderPro
options:
  bundleIdPrefix: com.selfuse
packages:
  Kanna:
    url: https://github.com/tid-kijyun/Kanna.git
    exactVersion: 5.3.0
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: 2.14.3
targets:
  ReaderPro:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ReaderPro
    dependencies:
      - package: Kanna
      - package: SwiftSoup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.selfuse.readerpro
        INFOPLIST_FILE: ReaderPro/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        READERPRO_GIT_SHA: development
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "阅读Pro"
        INFOPLIST_KEY_CFBundleName: "阅读Pro"
  ReaderProTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [ReaderProTests]
    dependencies:
      - target: ReaderPro
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
  ReaderProUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources: [ReaderProUITests]
    dependencies:
      - target: ReaderPro
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  ReaderPro:
    build:
      targets:
        ReaderPro: all
    test:
      gatherCoverageData: true
      targets:
        - ReaderProTests
        - ReaderProUITests
