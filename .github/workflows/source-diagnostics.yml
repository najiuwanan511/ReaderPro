name: Source crash diagnostics

on:
  workflow_dispatch:
    inputs:
      start:
        default: '1000'
        description: First source index
      count:
        default: '466'
        description: Number of sources
      concurrency:
        default: '8'
        description: Concurrent searches

jobs:
  diagnose:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare diagnostic fixture
        env:
          SOURCE_AUDIT_START: ${{ inputs.start }}
          SOURCE_AUDIT_COUNT: ${{ inputs.count }}
          SOURCE_AUDIT_CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          brew install xcodegen
          xcodegen generate
          mkdir -p build
          python3 scripts/fetch_user_pack.py
          python3 scripts/fixture_server.py > build/fixture-server.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Audit source window with Address Sanitizer
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if "iPhone" in x["name"]))')
          echo "READER_SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
          xcodebuild test -project ReaderPro.xcodeproj -scheme ReaderPro -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO \
            -enableAddressSanitizer YES -enableCodeCoverage NO \
            -only-testing:ReaderProTests/SourcePackAuditTests \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 1800 \
            -maximum-test-execution-time-allowance 1800 \
            -resultBundlePath build/SourceCrash.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee build/source-crash.log
      - name: Preserve crash and progress evidence
        if: always()
        run: |
          xcrun xcresulttool export diagnostics --path build/SourceCrash.xcresult --output-path build/diagnostics || true
          CONTAINER=$(xcrun simctl get_app_container "$READER_SIMULATOR_ID" com.selfuse.readerpro data 2>/dev/null || true)
          if [ -n "$CONTAINER" ] && [ -f "$CONTAINER/Documents/source-pack-search-audit-progress.json" ]; then
            cp "$CONTAINER/Documents/source-pack-search-audit-progress.json" build/
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-crash-diagnostics
          path: build
