name: Source crash diagnostics

on:
  workflow_dispatch:
    inputs:
      pack_id:
        description: User-authorized source pack
        type: choice
        default: '1325'
        options: ['1325', '1332']
      start:
        default: '1000'
        description: First source index
      count:
        default: '466'
        description: Number of sources
      concurrency:
        default: '8'
        description: Concurrent searches
      sanitizer:
        default: 'NO'
        description: Enable Address Sanitizer (YES or NO)

jobs:
  diagnose:
    runs-on: macos-latest
    timeout-minutes: 55
    env:
      SOURCE_AUDIT_PACK_ID: ${{ inputs.pack_id || '1325' }}
      SOURCE_AUDIT_START: ${{ inputs.start }}
      SOURCE_AUDIT_COUNT: ${{ inputs.count }}
      SOURCE_AUDIT_CONCURRENCY: ${{ inputs.concurrency }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare diagnostic fixture
        env:
          SOURCE_AUDIT_START: ${{ inputs.start }}
          SOURCE_AUDIT_COUNT: ${{ inputs.count }}
          SOURCE_AUDIT_CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          brew install xcodegen
          xcodegen generate
          mkdir -p build
          if [ "$SOURCE_AUDIT_PACK_ID" = "1332" ]; then
            python3 scripts/fetch_user_pack_1332.py
            export SOURCE_AUDIT_PACK_FILE=build/source-pack-1332.json
            echo 'AUDIT_TEST=ReaderProTests/SourcePackAuditTests/testEvery1332SourceCategoriesListsDetailsAndReadingChain' >> "$GITHUB_ENV"
          else
            python3 scripts/fetch_user_pack.py
            echo 'AUDIT_TEST=ReaderProTests/SourcePackAuditTests/testSearchEverySourceInUserPackAndExportIndividualResults' >> "$GITHUB_ENV"
          fi
          # The audit only needs the pack and configuration endpoints. Avoid
          # provisioning the unrelated TLS and proxy servers on this runner.
          python3 -u scripts/source_audit_server.py > build/fixture-server.log 2>&1 &
          SERVER_PID=$!
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/health; then exit 0; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          cat build/fixture-server.log
          exit 1
      - name: Audit source window and capture native crashes
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if "iPhone" in x["name"]))')
          echo "READER_SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
          if [ "$SOURCE_AUDIT_PACK_ID" = "1332" ]; then
            # These fixtures run locally, so a broken website cannot hide a
            # regression in stored fields, per-item state or category paging.
            xcodebuild test -project ReaderPro.xcodeproj -scheme ReaderPro -configuration Debug \
              -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO \
              -enableAddressSanitizer ${{ inputs.sanitizer }} -enableCodeCoverage NO \
              -only-testing:ReaderProTests/SourceEngineTests/testStoredDetailFieldsAreLiteralValuesAndReplacementKeepsItsSelector \
              -only-testing:ReaderProTests/SourceEngineTests/testDetailInitializationRestoresStoredNovelAndComicFields \
              -only-testing:ReaderProTests/SourceEngineTests/testListScriptsKeepBookChangesBetweenFieldsAndIsolateItems \
              -only-testing:ReaderProTests/SourceEngineTests/testSinglePageNovelAndComicCanOmitTheChapterURLRule \
              -only-testing:ReaderProTests/SourceEngineTests/testLegacyJSONTemplatesResolveRealComicDetailURLRules \
              -only-testing:ReaderProTests/SourceEngineTests/testComicChapterFlagsReceiveSelectableDOMElements \
              -only-testing:ReaderProTests/SourceEngineTests/testDetailTextRulesKeepAllXPathTitlePartsAndJoinScriptsBeforeTransform \
              -only-testing:ReaderProTests/JSImportAndResponseTests/testLoginResponseURLSupportsStringMethodsAndMethodCalls \
              -only-testing:ReaderProTests/LegadoIndexRuleTests/testLegacyColonIndicesIncludeAndExcludeIndividualRows \
              -only-testing:ReaderProTests/SourceEngineTests/testRuleTemplatesRecursiveJSONAndStoredValues \
              -only-testing:ReaderProTests/SourceEngineTests/testRealPackJavaScriptRuleTemplatesExpandBeforeEvaluation \
              -only-testing:ReaderProTests/DiscoveryPaginationTests/testDiscoveryListScriptsSeeTheRequestedPageWithoutLeakingIt \
              -only-testing:ReaderProTests/DiscoveryPaginationTests/testDynamicCategoriesCanParseHTMLFromNestedScriptTemplates \
              -only-testing:ReaderProTests/DiscoveryPaginationTests/testExploreScriptsPreserveDeferredRequestTemplatesAndEscapes \
              -resultBundlePath build/Source1332Compatibility.xcresult \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee build/source-1332-compatibility.log
          fi
          xcodebuild test -project ReaderPro.xcodeproj -scheme ReaderPro -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO \
            -enableAddressSanitizer ${{ inputs.sanitizer }} -enableCodeCoverage NO \
            -only-testing:"$AUDIT_TEST" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 3000 \
            -maximum-test-execution-time-allowance 3000 \
            -resultBundlePath build/SourceCrash.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee build/source-crash.log
      - name: Preserve crash and progress evidence
        if: always()
        run: |
          xcrun xcresulttool export diagnostics --path build/SourceCrash.xcresult --output-path build/diagnostics || true
          xcrun xcresulttool export attachments --path build/SourceCrash.xcresult --output-path build/audit-attachments || true
          CONTAINER=$(xcrun simctl get_app_container "$READER_SIMULATOR_ID" com.selfuse.readerpro data 2>/dev/null || true)
          if [ -n "$CONTAINER" ]; then
            for REPORT in source-pack-search-audit.json source-pack-search-audit-progress.json source-pack-certificate-audit-progress.json source-pack-1332-flow-audit.json source-pack-1332-flow-audit-progress.json; do
              if [ -f "$CONTAINER/tmp/$REPORT" ]; then cp "$CONTAINER/tmp/$REPORT" "build/$REPORT"; fi
              if [ -f "$CONTAINER/Documents/$REPORT" ]; then cp "$CONTAINER/Documents/$REPORT" "build/$REPORT"; fi
            done
          fi
          # CrashReporter writes asynchronously after xcodebuild observes death.
          sleep 15
          mkdir -p build/native-crashes
          find "$HOME/Library/Logs/DiagnosticReports" "$HOME/Library/Developer/CoreSimulator/Devices/$READER_SIMULATOR_ID/data/Library/Logs" \
            -type f \( -name '*ReaderPro*.ips' -o -name '*ReaderPro*.crash' \) \
            -exec cp {} build/native-crashes/ \; 2>/dev/null || true
          for REPORT in source-pack-search-audit.json source-pack-search-audit-progress.json source-pack-certificate-audit-progress.json source-pack-1332-flow-audit.json source-pack-1332-flow-audit-progress.json; do
            if [ ! -f "build/$REPORT" ]; then
              FOUND=$(find "$HOME/Library/Developer/CoreSimulator/Devices/$READER_SIMULATOR_ID/data/Containers/Data/Application" -name "$REPORT" -print -quit 2>/dev/null || true)
              if [ -n "$FOUND" ]; then cp "$FOUND" "build/$REPORT"; fi
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-crash-diagnostics
          path: build
