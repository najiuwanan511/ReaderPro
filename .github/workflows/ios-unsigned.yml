name: iOS unsigned build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Hosted macOS runner
        type: choice
        default: macos-15
        options: [macos-15, macos-15-intel]

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
          git diff --exit-code -- ReaderPro/Info.plist

      - name: Start deterministic HTTP fixtures
        run: |
          mkdir -p build
          python3 scripts/fetch_user_pack.py --rss-only
          python3 -u scripts/fixture_server.py > build/fixture-server.log 2>&1 &
          FIXTURE_PID=$!
          for i in {1..120}; do
            if curl --fail --silent --connect-timeout 2 --max-time 3 http://127.0.0.1:8765/health; then exit 0; fi
            if ! kill -0 "$FIXTURE_PID" 2>/dev/null; then cat build/fixture-server.log; exit 1; fi
            sleep 1
          done
          cat build/fixture-server.log
          exit 1

      - name: Test source engine, import, pagination and visible UI
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if "iPhone" in x["name"]))')
          echo "Testing on simulator $DEVICE"
          echo "READER_SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE" -b
          # Run 41803528748 compiled successfully but FrontBoard could not
          # launch the installed test runner after the simulator sat through
          # compilation. Refresh simulator services before executing tests,
          # as the iOS 17 Release workflow already does.
          xcodebuild build-for-testing \
            -project ReaderPro.xcodeproj -scheme ReaderPro -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee build/debug-build.log
          xcrun simctl shutdown "$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          # Exercise changed import/login flows and the multi-sheet editor first.
          # The full regression below still includes these tests.
          xcodebuild test-without-building \
            -project ReaderPro.xcodeproj -scheme ReaderPro -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -parallel-testing-enabled NO \
            -only-testing:ReaderProUITests/SourceFlowUITests/testReaderReplacementEntryEditsSavesAndRestoresRawContent \
            -only-testing:ReaderProUITests/SourceFlowUITests/testDiscoveryOpensCompleteDirectoryAndChapterDirectly \
            -only-testing:ReaderProUITests/SourceFlowUITests/testDiscoveryStartReadingUsesFullScreenAndReturnsToDirectory \
            -only-testing:ReaderProUITests/SourceFlowUITests/testSearchOpensDirectory \
            -only-testing:ReaderProUITests/SourceImportLoginUITests \
            -only-testing:ReaderProUITests/ReaderSettingsUITests/testSourceConcurrencySettingsPersistAfterRelaunch \
            -only-testing:ReaderProUITests/SearchAndPreviewUITests \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 600 \
            -resultBundlePath build/ReplacementEditorRegression.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee build/replacement-editor.log
          xcodebuild test-without-building \
            -project ReaderPro.xcodeproj \
            -scheme ReaderPro \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 600 \
            -skip-testing:ReaderProTests/SourcePackAuditTests \
            -skip-testing:ReaderProTests/SourcePack1329AuditTests \
            -skip-testing:ReaderProTests/LiveSourceTests \
            -skip-testing:ReaderProTests/SourceEngineTests/testOriginalLargeLibrariesSkipJavaCallTokenization \
            -skip-testing:ReaderProTests/SourceEngineTests/testUserProvidedPackImportsEverySourceWithoutLosingRules \
            -skip-testing:ReaderProUITests/SourceFlowUITests/testSearchWithRealUserPackCanBeCancelled \
            -skip-testing:ReaderProUITests/SourceFlowUITests/testDiscoveryOpensStaticAndScriptCategoriesFromRealUserPack \
            -skip-testing:ReaderProUITests/SourceFlowUITests/testPersistedRealPackThroughProductionRootSearchAndDiscovery \
            -resultBundlePath build/SourceRegression.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO | tee build/tests.log

      - name: Export UI screenshots
        if: always()
        continue-on-error: true
        run: |
          if [ -d build/SourceRegression.xcresult ]; then
            xcrun xcresulttool export attachments --path build/SourceRegression.xcresult --output-path build/screenshots
          elif [ -d build/ReplacementEditorRegression.xcresult ]; then
            xcrun xcresulttool export attachments --path build/ReplacementEditorRegression.xcresult --output-path build/screenshots
          fi
      - name: Verify the reader draws visible body glyphs
        run: xcrun swift scripts/verify_reader_pixels.swift build/screenshots

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-regression-evidence
          path: |
            build/SourceRegression.xcresult
            build/ReplacementEditorRegression.xcresult
            build/replacement-editor.log
            build/debug-build.log
            build/tests.log
            build/fixture-server.log
            build/screenshots
            build/source-pack-audit.json
            build/source-pack-search-audit.json
            build/source-pack-search-audit-progress.json
            build/source-pack-certificate-audit-progress.json
            build/UserPackAudit.xcresult
            build/source-audit.log
            build/audit-attachments

      - name: Verify source ATS configuration
        run: |
          python3 - <<'PY'
          import plistlib
          with open('ReaderPro/Info.plist', 'rb') as f:
              ats = plistlib.load(f)['NSAppTransportSecurity']
          assert ats.get('NSAllowsArbitraryLoads') is True
          assert 'NSAllowsArbitraryLoadsInWebContent' not in ats
          assert 'NSAllowsLocalNetworking' not in ats
          PY

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project ReaderPro.xcodeproj \
            -scheme ReaderPro \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ReaderPro.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            READERPRO_GIT_SHA=${{ github.sha }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Fix Info.plist (display name + ATS + background audio)
        run: |
          APP=build/ReaderPro.xcarchive/Products/Applications/ReaderPro.app/Info.plist
          # 显示名
          /usr/libexec/PlistBuddy -c "Delete :CFBundleDisplayName" "$APP" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 阅读Pro" "$APP"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleName" "$APP" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleName string 阅读Pro" "$APP"
          # 放行 HTTP（书源多为 http://，否则 ATS 拦截导致发现/搜索/正文全部拉不到）
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$APP" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$APP"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$APP"
          # 本地网络授权（iOS 14+：访问局域网书源/WebDAV 时弹授权框，附中文说明）
          /usr/libexec/PlistBuddy -c "Delete :NSLocalNetworkUsageDescription" "$APP" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 需要访问本地网络，以便连接局域网内的书源、订阅源与 WebDAV 服务器。" "$APP"
          # 后台音频播放
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$APP" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$APP"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$APP"
          # 文件共享（iTunes/访达直接拖书）
          /usr/libexec/PlistBuddy -c "Delete :UIFileSharingEnabled" "$APP" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$APP"
          /usr/libexec/PlistBuddy -c "Delete :LSSupportsOpeningDocumentsInPlace" "$APP" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$APP"

      - name: Package unsigned IPA
        run: |
          /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity' build/ReaderPro.xcarchive/Products/Applications/ReaderPro.app/Info.plist
          mkdir -p Payload
          cp -R build/ReaderPro.xcarchive/Products/Applications/ReaderPro.app Payload/
          ditto -c -k --keepParent Payload ReaderPro-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: ReaderPro-unsigned.ipa
