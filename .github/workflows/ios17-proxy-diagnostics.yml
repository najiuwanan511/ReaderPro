name: iOS 17 proxy diagnostics

on:
  workflow_dispatch:

jobs:
  proxy-diagnostics:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Prepare iOS 17 simulator and local proxy fixtures
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
          mkdir -p build
          python3 scripts/fixture_server.py > build/fixture-server.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/health
          if ! xcrun simctl list runtimes available | grep -q 'iOS 17.0'; then
            xcodebuild -downloadPlatform iOS -buildVersion 17.0
          fi
          DEVICE=$(xcrun simctl create ReaderPro-Proxy17 com.apple.CoreSimulator.SimDeviceType.iPhone-14-Pro-Max com.apple.CoreSimulator.SimRuntime.iOS-17-0)
          echo "READER_SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
      - name: Compare Network and CFNetwork proxy authentication
        run: |
          set -o pipefail
          xcodebuild test -project ReaderPro.xcodeproj -scheme ReaderPro -configuration Release \
            -destination "platform=iOS Simulator,id=$READER_SIMULATOR_ID" \
            -parallel-testing-enabled NO -enableCodeCoverage NO \
            -only-testing:ReaderProTests/SourceHeaderCompatibilityTests \
            -only-testing:ReaderProTests/LegacyProxyDiagnosticsTests \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 120 \
            -resultBundlePath build/ProxyDiagnostics.xcresult \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) READERPRO_TESTING READERPRO_PROXY_DIAGNOSTICS' \
            ENABLE_TESTABILITY=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee build/proxy-diagnostics.log
      - name: Preserve results and crash reports
        if: always()
        run: |
          if [ -d build/ProxyDiagnostics.xcresult ]; then
            xcrun xcresulttool export diagnostics --path build/ProxyDiagnostics.xcresult --output-path build/diagnostics || true
          fi
          sleep 5
          mkdir -p build/native-crashes
          if [ -n "$READER_SIMULATOR_ID" ]; then
            find "$HOME/Library/Logs/DiagnosticReports" "$HOME/Library/Developer/CoreSimulator/Devices/$READER_SIMULATOR_ID/data/Library/Logs" \
              -type f \( -name '*ReaderPro*.ips' -o -name '*ReaderPro*.crash' \) \
              -exec cp {} build/native-crashes/ \; 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios17-proxy-diagnostics
          path: |
            build/proxy-diagnostics.log
            build/fixture-server.log
            build/ProxyDiagnostics.xcresult
            build/diagnostics
            build/native-crashes
          retention-days: 7
