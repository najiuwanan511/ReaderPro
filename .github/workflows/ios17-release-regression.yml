name: iOS 17 Release regression

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-regression:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Prepare iOS 17.0 simulator and fixtures
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
          mkdir -p build
          python3 scripts/fetch_user_pack.py --rss-only
          python3 scripts/fixture_server.py > build/fixture-server.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/health
          if ! xcrun simctl list runtimes available | grep -q 'iOS 17.0'; then
            if ! xcodebuild -downloadPlatform iOS -buildVersion 17.0 > build/runtime-download.log 2>&1; then
              tail -n 40 build/runtime-download.log
              exit 1
            fi
          fi
          xcrun simctl list runtimes available
          DEVICE=$(xcrun simctl create ReaderPro-iOS17 com.apple.CoreSimulator.SimDeviceType.iPhone-14-Pro-Max com.apple.CoreSimulator.SimRuntime.iOS-17-0)
          echo "READER_SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
      - name: Test optimized build with deterministic import, reader, media and rule fixtures
        run: |
          set -o pipefail
          # The iOS 17 test daemon twice failed bootstrapping after the cold
          # simulator sat through compilation (runs 41474248784/41480512352).
          # Compile first, restart its control services, then run the unchanged
          # complete suite, including the replacement editor round trip.
          xcodebuild build-for-testing -project ReaderPro.xcodeproj -scheme ReaderPro -configuration Release \
            -destination "platform=iOS Simulator,id=$READER_SIMULATOR_ID" \
            -parallel-testing-enabled NO -enableCodeCoverage NO \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) READERPRO_TESTING' \
            ENABLE_TESTABILITY=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee build/ios17-build.log
          xcrun simctl shutdown "$READER_SIMULATOR_ID"
          xcrun simctl boot "$READER_SIMULATOR_ID"
          xcrun simctl bootstatus "$READER_SIMULATOR_ID" -b
          xcodebuild test-without-building -project ReaderPro.xcodeproj -scheme ReaderPro -configuration Release \
            -destination "platform=iOS Simulator,id=$READER_SIMULATOR_ID" \
            -parallel-testing-enabled NO -enableCodeCoverage NO \
            -only-testing:ReaderProUITests/SourceImportLoginUITests \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 600 \
            -resultBundlePath build/ImportLoginSmoke.xcresult \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) READERPRO_TESTING' \
            ENABLE_TESTABILITY=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee build/import-login-smoke.log
          xcodebuild test-without-building -project ReaderPro.xcodeproj -scheme ReaderPro -configuration Release \
            -destination "platform=iOS Simulator,id=$READER_SIMULATOR_ID" \
            -parallel-testing-enabled NO -enableCodeCoverage NO \
            -only-testing:ReaderProUITests/SourceFlowUITests \
            -only-testing:ReaderProUITests/ReaderSettingsUITests \
            -only-testing:ReaderProUITests/ReaderChapterPagingUITests \
            -only-testing:ReaderProUITests/DiscoveryPaginationUITests \
            -only-testing:ReaderProUITests/SourceImportLoginUITests \
            -only-testing:ReaderProTests/SourceImportLoginTests \
            -only-testing:ReaderProUITests/RssSourceUITests \
            -only-testing:ReaderProTests/JSConcurrencyStressTests \
            -only-testing:ReaderProTests/JSBridgeStressTests \
            -only-testing:ReaderProTests/JSImportAndResponseTests \
            -only-testing:ReaderProTests/SourceVariableCommentTests \
            -only-testing:ReaderProTests/SourceRuleObjectTests \
            -only-testing:ReaderProTests/RssSourceTests \
            -only-testing:ReaderProTests/ContentPaginationRuleTests \
            -only-testing:ReaderProTests/SourceURLCompatibilityTests \
            -only-testing:ReaderProTests/SourceHeaderCompatibilityTests \
            -only-testing:ReaderProTests/DiscoveryPaginationTests \
            -only-testing:ReaderProTests/SourceVideoTests \
            -only-testing:ReaderProTests/LegadoIndexRuleTests \
            -only-testing:ReaderProTests/LegadoJSONPathRuleTests \
            -only-testing:ReaderProTests/ReaderTextLayoutTests \
            -only-testing:ReaderProTests/ReaderContentPipelineTests \
            -only-testing:ReaderProTests/ReaderPageControllerTests \
            -only-testing:ReaderProTests/JavaCryptoTests \
            -only-testing:ReaderProUITests/SourceVideoUITests \
            -only-testing:ReaderProTests/ParityFoundationTests \
            -only-testing:ReaderProTests/MediaAndRssParityTests \
            -only-testing:ReaderProTests/RuleManagementParityTests \
            -only-testing:ReaderProTests/SourceEngineTests \
            -skip-testing:ReaderProTests/SourceEngineTests/testOriginalLargeLibrariesSkipJavaCallTokenization \
            -skip-testing:ReaderProTests/SourceEngineTests/testUserProvidedPackImportsEverySourceWithoutLosingRules \
            -skip-testing:ReaderProUITests/SourceFlowUITests/testSearchWithRealUserPackCanBeCancelled \
            -skip-testing:ReaderProUITests/SourceFlowUITests/testDiscoveryOpensStaticAndScriptCategoriesFromRealUserPack \
            -skip-testing:ReaderProUITests/SourceFlowUITests/testPersistedRealPackThroughProductionRootSearchAndDiscovery \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 600 \
            -resultBundlePath build/ReleaseRegression.xcresult \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) READERPRO_TESTING' \
            ENABLE_TESTABILITY=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee build/release-regression.log
      - name: Preserve test results and crash reports
        if: always()
        run: |
          if [ -d build/ReleaseRegression.xcresult ]; then
            xcrun xcresulttool export attachments --path build/ReleaseRegression.xcresult --output-path build/screenshots || true
            xcrun xcresulttool export diagnostics --path build/ReleaseRegression.xcresult --output-path build/diagnostics || true
          elif [ -d build/ImportLoginSmoke.xcresult ]; then
            xcrun xcresulttool export attachments --path build/ImportLoginSmoke.xcresult --output-path build/screenshots || true
            xcrun xcresulttool export diagnostics --path build/ImportLoginSmoke.xcresult --output-path build/diagnostics || true
          elif [ -d build/ReplacementEditorRegression.xcresult ]; then
            xcrun xcresulttool export attachments --path build/ReplacementEditorRegression.xcresult --output-path build/screenshots || true
            xcrun xcresulttool export diagnostics --path build/ReplacementEditorRegression.xcresult --output-path build/diagnostics || true
          fi
          sleep 10
          mkdir -p build/native-crashes
          if [ -n "$READER_SIMULATOR_ID" ]; then
            find "$HOME/Library/Logs/DiagnosticReports" "$HOME/Library/Developer/CoreSimulator/Devices/$READER_SIMULATOR_ID/data/Library/Logs" \
              -type f \( -name '*ReaderPro*.ips' -o -name '*ReaderPro*.crash' \) \
              -exec cp {} build/native-crashes/ \; 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios17-release-regression
          path: build
